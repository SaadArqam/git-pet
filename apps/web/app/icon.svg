<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#4f46e5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#0d0f18" />

  <!-- Soft glow behind paw -->
  <circle cx="256" cy="256" r="210" fill="url(#glow)" />

  <!-- Geometric Paw -->
  <g fill="#ffffff">
    <!-- Main pad (pill + circle) -->
    <rect x="180" y="260" width="152" height="120" rx="60" />
    <circle cx="256" cy="260" r="76" />
    
    <!-- Toe pads -->
    <circle cx="120" cy="226" r="40" />
    <circle cx="186" cy="126" r="44" />
    <circle cx="326" cy="126" r="44" />
    <circle cx="392" cy="226" r="40" />
  </g>
</svg>
