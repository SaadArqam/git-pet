<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid dark background: #0d0f18 -->
  <rect width="512" height="512" fill="#0d0f18" />
  
  <defs>
    <!-- Tight, subtle purple glow -->
    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.8" />
    </filter>
  </defs>
  
  <!-- Group perfectly centered -->
  <g transform="translate(64, 70.4) scale(0.75)" fill="#ffffff" filter="url(#purple-glow)">
    
    <!-- Central Pad -->
    <path d="M256,182 
             C170,182 108,260 108,348 
             C108,435 160,490 256,490 
             C352,490 404,435 404,348 
             C404,260 342,182 256,182 Z" />
             
    <!-- Toe 1 (Far Left) -->
    <ellipse cx="70" cy="190" rx="55" ry="75" transform="rotate(-30 70 190)" />
    <!-- Toe 2 (Inner Left) -->
    <ellipse cx="160" cy="90" rx="60" ry="85" transform="rotate(-15 160 90)" />
    <!-- Toe 3 (Inner Right) -->
    <ellipse cx="352" cy="90" rx="60" ry="85" transform="rotate(15 352 90)" />
    <!-- Toe 4 (Far Right) -->
    <ellipse cx="442" cy="190" rx="55" ry="75" transform="rotate(30 442 190)" />
  </g>
</svg>
